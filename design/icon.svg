<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Master icon source. Rendered to assets/icons/icon.png (80x80) and
       icon-large.png (130x130); see design/README.md for the render command.
       Mark: four tiles echoing the app's justified photo-wall layout,
       dusk-gradient palette continuing the app accent #e5484d. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181b23"/>
      <stop offset="1" stop-color="#0c0d11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.55">
      <stop offset="0" stop-color="#ff8a5c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#ff8259"/>
    </linearGradient>
    <linearGradient id="tB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8259"/>
      <stop offset="1" stop-color="#ef5a68"/>
    </linearGradient>
    <linearGradient id="tC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ee5767"/>
      <stop offset="1" stop-color="#d14d7e"/>
    </linearGradient>
    <linearGradient id="tD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c94f86"/>
      <stop offset="1" stop-color="#7e58a8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="800" rx="132" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="800" rx="132" fill="url(#glow)"/>

  <!-- Justified photo-wall mark: [wide][narrow] / [narrow][wide] -->
  <rect x="176" y="260" width="272" height="128" rx="30" fill="url(#tA)"/>
  <rect x="472" y="260" width="152" height="128" rx="30" fill="url(#tB)"/>
  <rect x="176" y="412" width="152" height="128" rx="30" fill="url(#tC)"/>
  <rect x="352" y="412" width="272" height="128" rx="30" fill="url(#tD)"/>

  <!-- Low sun inside the top-right tile -->
  <circle cx="548" cy="316" r="27" fill="#fff0d6"/>
</svg>
