<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Master splash source. Rendered to assets/splash.png (1920x1080).
       Background matches appinfo bgColor #0e0f12 so the splash blends
       into the app's first paint. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#ff8a5c" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#ff8259"/>
    </linearGradient>
    <linearGradient id="tB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8259"/>
      <stop offset="1" stop-color="#ef5a68"/>
    </linearGradient>
    <linearGradient id="tC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ee5767"/>
      <stop offset="1" stop-color="#d14d7e"/>
    </linearGradient>
    <linearGradient id="tD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c94f86"/>
      <stop offset="1" stop-color="#7e58a8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#0e0f12"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#glow)"/>

  <!-- Mark: same tile cluster as the icon, 0.62x, centered above the wordmark.
       Cluster is 448x280 in icon space -> 278x174 here. -->
  <g transform="translate(821 342) scale(0.62)">
    <rect x="0" y="0" width="272" height="128" rx="30" fill="url(#tA)"/>
    <rect x="296" y="0" width="152" height="128" rx="30" fill="url(#tB)"/>
    <rect x="0" y="152" width="152" height="128" rx="30" fill="url(#tC)"/>
    <rect x="176" y="152" width="272" height="128" rx="30" fill="url(#tD)"/>
    <circle cx="372" cy="56" r="27" fill="#fff0d6"/>
  </g>

  <text x="960" y="638" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, sans-serif" font-weight="300"
        font-size="58" letter-spacing="10" fill="#e8eaef">Photofield</text>
</svg>
